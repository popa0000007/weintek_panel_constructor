<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Конструктор панели ГЦУ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Пульт инженера АСУ ТП: рабочее поле панели в центре, справа свойства, слева палитра. Цвета — из палитры панели ГЦУ (GCU_Colors.txt). */
:root {
  --bg: #D9DAD5; --chrome: #ECEDE9; --chrome2: #E2E3DE; --line: #BFC2BB; --line2: #D3D5D0;
  --fg: #1D2023; --fg2: #4B5157; --fg3: #7A7F85;
  --accent: #2F6FB8; --accent-fg: #FFFFFF; --go: #1E8A3C; --warn: #B07F00; --bad: #C42B2B;
  --field: #FFFFFF; --hover: #DCE6F2; --sel: #2F6FB8; --stage: #A9ADA6;
  --f-ui: 'IBM Plex Sans', 'Segoe UI', Arial, sans-serif;
  --f-cond: 'IBM Plex Sans Condensed', 'Arial Narrow', 'Segoe UI', Arial, sans-serif;
  --f-mono: 'IBM Plex Mono', Consolas, 'Courier New', monospace;
  --r: 4px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1B1E21; --chrome: #23272B; --chrome2: #2B3035; --line: #3B4045; --line2: #33383D;
  --fg: #E8E9E6; --fg2: #B9BDC1; --fg3: #8A9096;
  --accent: #4A8AD4; --accent-fg: #FFFFFF; --go: #2E9E4F; --warn: #E0A100; --bad: #E05555;
  --field: #1A1D20; --hover: #2E3A48; --sel: #5A9BE6; --stage: #15181A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1B1E21; --chrome: #23272B; --chrome2: #2B3035; --line: #3B4045; --line2: #33383D;
  --fg: #E8E9E6; --fg2: #B9BDC1; --fg3: #8A9096;
  --accent: #4A8AD4; --accent-fg: #FFFFFF; --go: #2E9E4F; --warn: #E0A100; --bad: #E05555;
  --field: #1A1D20; --hover: #2E3A48; --sel: #5A9BE6; --stage: #15181A; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 13px/1.35 var(--f-ui); overflow: hidden; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--chrome2); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 8px; cursor: pointer; white-space: nowrap; }
button:hover { background: var(--hover); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button:disabled { opacity: .45; cursor: default; }
button.accent { background: var(--go); border-color: var(--go); color: #fff; font-weight: 600; }
button.accent2 { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
button.danger { color: var(--bad); }
input, select, textarea { background: var(--field); color: var(--fg); border: 1px solid var(--line); border-radius: 3px; padding: 3px 6px; min-width: 0; }
input[type=checkbox] { accent-color: var(--accent); }
input.bad { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad) inset; }
input.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
label.chk { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }

#app { height: 100%; display: grid; grid-template-columns: 236px minmax(0, 1fr) 320px; grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "top top top" "left center right";
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
#top { grid-area: top; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 6px max(12px, env(safe-area-inset-right, 0px)) 6px max(12px, env(safe-area-inset-left, 0px)); background: var(--chrome); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 9px; }
.brand b { display: block; font: 600 15px/1.1 var(--f-cond); letter-spacing: .01em; }
.brand small { color: var(--fg3); font: 11px var(--f-mono); }
.brand .mark { width: 22px; height: 22px; border-radius: 3px; background: linear-gradient(90deg, #1E8A3C 0 33%, #E0A100 33% 66%, #C42B2B 66%); box-shadow: inset 0 0 0 2px var(--chrome); outline: 1px solid var(--line); }
.tb { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.tb.grow { flex: 1; }
.tb .sep { width: 1px; height: 20px; background: var(--line); margin: 0 3px; }
.tb.small button { padding: 2px 7px; min-width: 28px; }
.tb .lbl { color: var(--fg3); font-size: 12px; margin-right: 2px; }
.mode { border: 1px solid var(--line); border-radius: 5px; padding: 2px; background: var(--chrome2); gap: 2px; }
.mode button { border: 0; background: transparent; }
.mode button.on { background: var(--accent); color: var(--accent-fg); font-weight: 600; }

#left, #right { background: var(--chrome); overflow: auto; min-height: 0; }
#left { grid-area: left; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
#right { grid-area: right; border-left: 1px solid var(--line); }
.tabs { display: flex; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--chrome); z-index: 2; }
.tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 8px 4px; font: 600 12px var(--f-cond); letter-spacing: .04em; text-transform: uppercase; color: var(--fg2); border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--fg); border-bottom-color: var(--accent); }
.tabpane { padding: 8px; overflow: auto; flex: 1; }

.palgrp h3 { margin: 10px 2px 5px; font: 600 11px var(--f-cond); letter-spacing: .08em; text-transform: uppercase; color: var(--fg3); }
.palgrp:first-child h3 { margin-top: 2px; }
.pal { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.pal button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px 5px; background: var(--chrome2); font-size: 11.5px; line-height: 1.15; white-space: normal; text-align: center; cursor: grab; min-height: 58px; }
.pal button canvas { width: 40px; height: 26px; pointer-events: none; }
.pal button:active { cursor: grabbing; }

.list { display: flex; flex-direction: column; gap: 1px; }
.li { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 3px; cursor: pointer; min-width: 0; }
.li:hover { background: var(--hover); }
.li.on { background: var(--accent); color: var(--accent-fg); }
.li .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .ty { color: var(--fg3); font: 10.5px var(--f-mono); }
.li.on .ty { color: inherit; opacity: .8; }
.li .ic { width: 18px; text-align: center; opacity: .55; border: 0; background: none; padding: 0; }
.li .ic.act { opacity: 1; }
.li.child { padding-left: 26px; font-size: 12px; opacity: .8; }
.secttl { display: flex; align-items: center; justify-content: space-between; margin: 10px 2px 4px; font: 600 11px var(--f-cond); letter-spacing: .08em; text-transform: uppercase; color: var(--fg3); }
.secttl:first-child { margin-top: 0; }
.btnrow { display: flex; gap: 4px; flex-wrap: wrap; margin: 6px 0; }

#center { grid-area: center; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
#alignbar { padding: 4px 10px; background: var(--chrome); border-bottom: 1px solid var(--line); }
#stageWrap { flex: 1; overflow: auto; background: var(--stage); min-height: 0; position: relative; }
#stage { position: relative; margin: 24px; box-shadow: 0 0 0 1px rgba(0,0,0,.25), 0 6px 24px rgba(0,0,0,.25); }
#stage canvas { position: absolute; left: 0; top: 0; display: block; }
#cvOv { cursor: default; outline: none; }
#status { display: flex; gap: 18px; padding: 4px 12px; background: var(--chrome); border-top: 1px solid var(--line); font: 11.5px var(--f-mono); color: var(--fg2); white-space: nowrap; overflow: hidden; }
#stMsg { color: var(--warn); overflow: hidden; text-overflow: ellipsis; }

#insp { padding: 0 0 20px; }
.ih { position: sticky; top: 0; z-index: 2; background: var(--chrome); padding: 10px 12px 8px; border-bottom: 1px solid var(--line); }
.ih h2 { margin: 0; font: 600 15px var(--f-cond); }
.ih p { margin: 2px 0 0; color: var(--fg3); font-size: 12px; }
.sec { padding: 8px 12px 10px; border-bottom: 1px solid var(--line2); }
.sec > h4 { margin: 0 0 6px; font: 600 11px var(--f-cond); letter-spacing: .08em; text-transform: uppercase; color: var(--fg3); display: flex; justify-content: space-between; align-items: center; }
.row { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 6px; align-items: center; margin: 4px 0; }
.row > label { color: var(--fg2); font-size: 12px; }
.row .hint { grid-column: 2; color: var(--fg3); font-size: 11px; margin-top: -2px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.grid4 label { display: flex; flex-direction: column; font-size: 10.5px; color: var(--fg3); gap: 1px; }
.tagin { display: flex; gap: 3px; min-width: 0; }
.tagin input { flex: 1; font-family: var(--f-mono); font-size: 12px; }
.tagin button { padding: 2px 6px; }
.colin { display: flex; gap: 4px; align-items: center; min-width: 0; }
.colin input[type=color] { width: 30px; height: 24px; padding: 1px; }
.colin input[type=text] { flex: 1; font-family: var(--f-mono); font-size: 12px; }
.colin select { width: 30px; padding: 2px; }
.box { border: 1px solid var(--line); border-radius: var(--r); padding: 6px; margin: 4px 0; background: var(--chrome2); }
.box .row { grid-template-columns: 82px minmax(0, 1fr); }
.crow { display: grid; grid-template-columns: minmax(0, 1fr) 92px 54px 22px; gap: 3px; margin: 3px 0; align-items: center; }
.crow button, .mini { padding: 0 5px; line-height: 20px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.tbl th { text-align: left; font: 600 11px var(--f-cond); letter-spacing: .04em; color: var(--fg3); padding: 3px 4px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--chrome); }
.tbl td { padding: 2px 3px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
.tbl input, .tbl select { width: 100%; padding: 2px 4px; font-size: 12px; }
.tbl tr.hl td { background: var(--hover); }
.note { color: var(--fg2); font-size: 12px; background: var(--chrome2); border-left: 3px solid var(--accent); padding: 6px 8px; margin: 6px 0; }
.note.warn { border-left-color: var(--warn); }
.note.bad { border-left-color: var(--bad); }
.kbd { font: 11px var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; background: var(--field); }

.modal { position: fixed; inset: 0; background: rgba(10,12,14,.5); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); }
.mbox { background: var(--chrome); border: 1px solid var(--line); border-radius: 6px; width: min(1180px, 100%); max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 12px 48px rgba(0,0,0,.35); }
.mbox.narrow { width: min(520px, 100%); }
.mbox > header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line); background: #23272B; color: #E8E9E6; border-radius: 6px 6px 0 0; }
.mbox > header h2 { margin: 0; font: 600 16px var(--f-cond); }
.mbox > header .x { background: transparent; border: 0; color: #E8E9E6; font-size: 22px; line-height: 1; }
#mBody { padding: 12px 14px 14px; overflow: auto; min-height: 0; }
.cols { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 14px; min-height: 0; }
.scroll { overflow: auto; max-height: 62vh; border: 1px solid var(--line); border-radius: var(--r); }
textarea.code { width: 100%; height: 190px; font: 11.5px/1.4 var(--f-mono); white-space: pre; resize: vertical; }
.sizebar { height: 8px; border-radius: 4px; background: var(--line2); overflow: hidden; margin: 4px 0 2px; }
.sizebar i { display: block; height: 100%; background: var(--go); }
.sizebar i.warn { background: var(--warn); } .sizebar i.bad { background: var(--bad); }
ol.steps { margin: 6px 0; padding-left: 20px; } ol.steps li { margin: 3px 0; }
.ctx { position: fixed; z-index: 60; background: var(--chrome); border: 1px solid var(--line); border-radius: 5px; box-shadow: 0 6px 20px rgba(0,0,0,.25); padding: 4px; min-width: 190px; }
.ctx button { display: flex; justify-content: space-between; gap: 20px; width: 100%; border: 0; background: transparent; text-align: left; padding: 5px 9px; }
.ctx button:hover { background: var(--hover); }
.ctx button span { color: var(--fg3); font: 11px var(--f-mono); }
.ctx hr { border: 0; border-top: 1px solid var(--line2); margin: 3px 0; }
.toast { position: fixed; left: 50%; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #23272B; color: #fff; padding: 8px 16px; border-radius: 5px; z-index: 70; font-weight: 500; box-shadow: 0 6px 20px rgba(0,0,0,.3); max-width: 90vw; }
.simv { font-family: var(--f-mono); font-size: 12px; }
.chip { display: inline-block; padding: 0 6px; border-radius: 3px; font: 600 10.5px var(--f-cond); letter-spacing: .04em; background: var(--line2); color: var(--fg2); }
.chip.w { background: var(--accent); color: #fff; }

@media (max-width: 1100px) { #app { grid-template-columns: 200px minmax(0, 1fr) 280px; } }
@media (max-width: 860px) {
  body { overflow: auto; }
  #app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto auto; grid-template-areas: "top" "center" "right" "left"; }
  #stageWrap { height: 70vh; }
  #left, #right { max-height: none; border: 0; border-top: 1px solid var(--line); }
  .cols { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</style>
<div id="app">
  <header id="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><div><b>Конструктор панели</b><small>Weintek cMT · Siemens S7 · v1.0 · 2026-10-25</small></div></div>
    <div class="tb" role="toolbar" aria-label="Проект">
      <button id="bNew" title="Новый проект">Новый</button>
      <button id="bOpen" title="Открыть проект из файла .json">Открыть</button>
      <button id="bSave" title="Сохранить проект в файл .json (Ctrl+S)">Сохранить</button>
      <button id="bExample" title="Загрузить пример: мнемосхема ГЦУ">Пример</button>
      <input type="file" id="fOpen" accept=".json,application/json" hidden>
    </div>
    <div class="tb" role="toolbar" aria-label="Правка">
      <button id="bUndo" title="Отменить (Ctrl+Z)">↶</button>
      <button id="bRedo" title="Повторить (Ctrl+Y)">↷</button>
      <span class="sep"></span>
      <button id="bCopy" title="Копировать (Ctrl+C)">Копир.</button>
      <button id="bPaste" title="Вставить (Ctrl+V)">Вставить</button>
      <button id="bDup" title="Дублировать (Ctrl+D)">Дубль</button>
      <button id="bDel" title="Удалить (Delete)">Удалить</button>
      <span class="sep"></span>
      <button id="bGroup" title="Сгруппировать (Ctrl+G)">Группа</button>
      <button id="bUngroup" title="Разгруппировать (Ctrl+Shift+G)">Разгр.</button>
      <button id="bFront" title="На передний план">▲ Вперёд</button>
      <button id="bBack" title="На задний план">▼ Назад</button>
    </div>
    <div class="tb" role="toolbar" aria-label="Вид">
      <label class="chk"><input type="checkbox" id="cGrid" checked> Сетка</label>
      <select id="sGrid" title="Шаг сетки"><option>4</option><option selected>8</option><option>10</option><option>16</option><option>20</option></select>
      <label class="chk"><input type="checkbox" id="cSnap" checked> Привязка</label>
      <select id="sZoom" title="Масштаб"><option value="fit">По окну</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select>
    </div>
    <div class="tb grow"></div>
    <div class="tb mode" role="group" aria-label="Режим">
      <button id="mEdit" class="on" title="Редактирование">Редактор</button>
      <button id="mRun" title="Просмотр: элементы нажимаются, значения ПЛК имитируются">▶ Просмотр</button>
    </div>
    <div class="tb">
      <button id="bData" class="accent2" title="Блоки данных ПЛК, теги, опросы">Данные ПЛК</button>
      <button id="bExport" class="accent" title="Получить код и конфигурацию для EasyBuilder">Экспорт в панель</button>
      <button id="bHelp" title="Как пользоваться">?</button>
    </div>
  </header>
  <aside id="left">
    <nav class="tabs" role="tablist">
      <button class="on" data-tab="pal" role="tab">Элементы</button>
      <button data-tab="win" role="tab">Окна</button>
      <button data-tab="lay" role="tab">Слои</button>
    </nav>
    <div id="tab-pal" class="tabpane"></div>
    <div id="tab-win" class="tabpane" hidden></div>
    <div id="tab-lay" class="tabpane" hidden></div>
  </aside>
  <main id="center">
    <div id="alignbar" class="tb small" hidden>
      <span class="lbl">Выровнять:</span>
      <button data-al="l" title="По левому краю">⇤</button><button data-al="hc" title="По центру по горизонтали">↔</button><button data-al="r" title="По правому краю">⇥</button>
      <button data-al="t" title="По верху">⤒</button><button data-al="vc" title="По центру по вертикали">↕</button><button data-al="b" title="По низу">⤓</button>
      <span class="sep"></span>
      <button data-al="dh" title="Распределить по горизонтали">⋯</button><button data-al="dv" title="Распределить по вертикали">⋮</button>
      <button data-al="sw" title="Одинаковая ширина">=Ш</button><button data-al="sh" title="Одинаковая высота">=В</button>
    </div>
    <div id="stageWrap">
      <div id="stage">
        <canvas id="cvRt"></canvas>
        <canvas id="cvOv" tabindex="0" aria-label="Холст окна панели"></canvas>
      </div>
    </div>
    <footer id="status"><span id="stPos">—</span><span id="stSel"></span><span id="stWin"></span><span id="stMsg"></span></footer>
  </main>
  <aside id="right">
    <div id="insp"></div>
  </aside>
</div>
<div id="modal" class="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><header><h2 id="mTitle"></h2><button class="x" id="mClose" aria-label="Закрыть">×</button></header><div id="mBody"></div></div></div>
<div id="ctx" class="ctx" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>

c){\nwrite(cfg.selAddr,[n,c],'selAddr');\nif(c>1000)logEvent('Изменено: '+VALVE_NAMES[n]+' — время хода = '+(c-1000)+' с');\n}\nfunction setManSpeed(n,v){\nconst tmp=hmiW.slice();\nputReal(tmp,n===1?42:46,v);\nwrite(cfg.speedAddr,[tmp[21],tmp[22],tmp[23],tmp[24]],'speedAddr');\n}\nfunction writeSet(mutator){\nif(!hasSet&&!DEMO){toast('Уставки ещё не прочитаны из ПЛК');return;}\nconst copy=setW.slice();\nmutator(copy);\nwrite(cfg.setAddr,copy,'setAddr');\n}\nfunction setI16(off,v){writeSet(function(a){putI16(a,off,v);});}\nfunction setReal(off,v){writeSet(function(a){putReal(a,off,v);});}\nfunction setRepair(bit,val){writeSet(function(a){putBit(a,44,bit,val);});}\nconst canvas=new Canvas();\nself.widget.add(canvas);\nconst mouse=new MouseArea();\nself.widget.add(mouse);\nlet SC=1;\nfunction updateScale(){\nconst w=self.widget.width||W0;\nSC=w/W0;\nif(!(SC>0))SC=1;\n}\nupdateScale();\nconst ui={\npopup:null,\nstack:[],\ntoast:null,\nblink:false,\npress:null\n};\nlet hits=[];\nfunction hit(x,y,w,h,fn,id,hold){hits.push({x:x,y:y,w:w,h:h,fn:fn,id:id||'',hold:hold||null});}\nfunction openPopup(p){if(ui.popup)ui.stack.push(ui.popup);ui.popup=p;req();}\nfunction closePopup(){ui.popup=ui.stack.length?ui.stack.pop():null;req();}\nfunction closeAll(){ui.popup=null;ui.stack=[];req();}\nmouse.on('mousedown',function(e){\nconst p=toLocal(e);\nconst h=findHit(p.x,p.y);\nui.press=h?h.id:null;\nif(h&&h.hold){ui.holding=h;try{h.hold.down();}catch(err){console.log('hold: '+err.message);}}\nif(ui.press)req();\n});\nmouse.on('mouseup',function(){\nif(ui.holding){const hh=ui.holding;ui.holding=null;try{hh.hold.up();}catch(err){console.log('hold: '+err.message);}}\nif(ui.press){ui.press=null;req();}\n});\nmouse.on('click',function(e){\nconst p=toLocal(e);\nconst h=findHit(p.x,p.y);\nif(h&&h.fn&&!h.hold){\ntry{h.fn();}catch(err){console.log('click error: '+err.message);}\ndraw();\n}\n});\nfunction toLocal(e){return{x:e.x/SC+OX,y:e.y/SC+OY};}\nfunction findHit(x,y){\nfor(let i=hits.length-1;i>=0;i--){\nconst h=hits[i];\nif(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h)return h;\n}\nreturn null;\n}\nconst cv=canvas;\nfunction font(sz,bold){cv.font=(bold?BOLD:'')+sz+'px '+FONT;}\nfunction fillRect(x,y,w,h,color){cv.fillStyle=color;cv.fillRect(x,y,w,h);}\nfunction strokeRect(x,y,w,h,color,lw,dash){\ncv.strokeStyle=color;cv.lineWidth=lw||1;\ncv.setLineDash(dash||[]);\ncv.strokeRect(x,y,w,h);\nif(dash)cv.setLineDash([]);\n}\nfunction rrPath(x,y,w,h,r){\ncv.beginPath();\ncv.moveTo(x+r,y);\ncv.lineTo(x+w-r,y);cv.arcTo(x+w,y,x+w,y+r,r);\ncv.lineTo(x+w,y+h-r);cv.arcTo(x+w,y+h,x+w-r,y+h,r);\ncv.lineTo(x+r,y+h);cv.arcTo(x,y+h,x,y+h-r,r);\ncv.lineTo(x,y+r);cv.arcTo(x,y,x+r,y,r);\ncv.closePath();\n}\nfunction rrect(x,y,w,h,r,fill,stroke,lw,dash){\nrrPath(x,y,w,h,r);\nif(fill){cv.fillStyle=fill;cv.fill();}\nif(stroke){\ncv.strokeStyle=stroke;cv.lineWidth=lw||1;cv.setLineDash(dash||[]);\ncv.stroke();\nif(dash)cv.setLineDash([]);\n}\n}\nfunction line(x1,y1,x2,y2,color,lw,dash){\ncv.beginPath();cv.moveTo(x1,y1);cv.lineTo(x2,y2);\ncv.strokeStyle=color;cv.lineWidth=lw||1;cv.setLineDash(dash||[]);\ncv.stroke();\nif(dash)cv.setLineDash([]);\n}\nfunction hpipe(x1,x2,y,th,color){fillRect(x1,y-th/2,x2-x1,th,color);}\nfunction vpipe(x,y1,y2,th,color){fillRect(x-th/2,y1,th,y2-y1,color);}\nfunction text(s,x,y,sz,color,align,bold){\nfont(sz||14,bold);\ncv.fillStyle=color||C.text;\ncv.textAlign=align||'left';\ncv.textBaseline='middle';\ncv.fillText(String(s),x,y);\n}\nfunction textFit(s,x,y,maxW,sz,color,align,bold){\nlet size=sz;\nfont(size,bold);\nwhile(size>9&&cv.measureText&&cv.measureText(String(s)).width>maxW){size--;font(size,bold);}\ntext(s,x,y,size,color,align,bold);\n}\nfunction poly(pts,fill,stroke,lw,dash){\ncv.beginPath();\ncv.moveTo(pts[0],pts[1]);\nfor(let i=2;i<pts.length;i+=2)cv.lineTo(pts[i],pts[i+1]);\ncv.closePath();\nif(fill){cv.fillStyle=fill;cv.fill();}\nif(stroke){cv.strokeStyle=stroke;cv.lineWidth=lw||1;cv.lineJoin='round';cv.setLineDash(dash||[]);cv.stroke();if // ================================================================ КОНСТРУКТОР: модель проекта, импорт, экспорт
// Чистые функции без интерфейса (используются редактором и тестами).
'use strict';
const TYPES = {           // тип поля: [размер в байтах, название как в TIA]
  bool: [1, 'Bool'], byte: [1, 'Byte'], sint: [1, 'SInt'], int: [2, 'Int'], uint: [2, 'UInt'], word: [2, 'Word'],
  dint: [4, 'DInt'], udint: [4, 'UDInt'], dword: [4, 'DWord'], real: [4, 'Real']
};
const ENGINE_LIMIT = 100000;          // лимит исходного кода JS-объекта EasyBuilder (~100 КБ)
const TAG_KEYS = { tag: 1, ok: 1, sp: 1, vt: 1, lt: 1, rt: 1, alive: 1 };
const GCU_TYPES = { pumpcard: 1, alarmline: 1 };
const GCU_ACTS = { gcu: 1, pump: 1, valvecmd: 1, valvewin: 1, pumpwin: 1, resetall: 1 };
const GCU_ADDR = { cmdAddr: [100, 0], speedAddr: [100, 42], selAddr: [100, 174], setAddr: [101, 0], extAddr: [100, 188] };

function clone(o) { return JSON.parse(JSON.stringify(o)); }
function utf8(s) { return unescape(encodeURIComponent(s)); }
function b64(bin) {
  if (typeof btoa === 'function') return btoa(bin);
  return Buffer.from(bin, 'binary').toString('base64');
}
// Адрес EasyBuilder (тип «Адрес» в конфигурации JS-объекта): устройство + DBn + «номер DB и 4 цифры смещения»
function encodeAddress(dev, db, off) {
  const a = String(db) + ('0000' + off).slice(-4);
  const d = utf8(dev);
  let s = String.fromCharCode(0, 0, 1, d.length & 255, d.length >> 8) + d + String.fromCharCode(0x68, a.length & 255, a.length >> 8) + a;
  s += String.fromCharCode(0, 0, 0, 0, 0, 2, 1, 0);
  return 'Address|' + b64(s);
}
function tagName(db, f) { return db.name + '.' + f.n; }
function allTags(project) {
  const out = {};
  (project.dbs || []).forEach(function (db) {
    (db.fields || []).forEach(function (f) { out[tagName(db, f)] = { db: db, f: f }; });
  });
  return out;
}

// ---------------------------------------------------------------- обход элементов
function walkEls(list, fn) {
  (list || []).forEach(function (e) { fn(e); if (e.t === 'group') walkEls(e.els, fn); });
}
function walkObj(o, fn, key) {
  if (Array.isArray(o)) { o.forEach(function (x) { walkObj(x, fn, key); }); return; }
  if (o && typeof o === 'object') { Object.keys(o).forEach(function (k) { fn(k, o[k], o); walkObj(o[k], fn, k); }); }
}
function refsOf(els) {
  const refs = {};
  walkObj(els, function (k, v) { if (TAG_KEYS[k] && typeof v === 'string' && v) refs[v] = 1; });
  return Object.keys(refs);
}
function popupRefs(els, project) {          // своих окон, на которые есть ссылки (с вложенными)
  const ids = {}, queue = [els];
  while (queue.length) {
    const l = queue.shift();
    walkObj(l, function (k, v, o) {
      if (k === 'a' && v === 'popup' && o.id && !ids[o.id]) {
        const p = (project.pops || []).find(function (q) { return q.id === o.id; });
        if (p) { ids[o.id] = p; queue.push(p.els || []); }
      }
    });
  }
  return ids;
}
function usesGcu(els, refs) {
  let g = refs.some(function (r) { return /^gcu(set|spd)?:/.test(r); });
  walkObj(els, function (k, v, o) {
    if (k === 't' && (GCU_TYPES[v] || ((v === 'valve' || v === 'pump' || v === 'cyclone') && o.src !== 'tag'))) g = true;
    if (k === 'a' && GCU_ACTS[v]) g = true;
  });
  return g;
}
function typesOf(els) {
  const t = {};
  walkObj(els, function (k, v, o) { if (k === 't' && typeof v === 'string' && o.id !== undefined) t[v] = 1; });
  return t;
}
function cleanEls(list, edit) {     // убрать служебные поля редактора (edit — скрытые в редакторе не рисовать)
  return (list || []).filter(function (e) { return !(edit && e._h); }).map(function (e) {
    const o = {};
    Object.keys(e).forEach(function (k) { if (k !== 'nm' && k !== '_h' && k !== '_l' && k !== '_off') o[k] = e[k]; });
    if (o.t === 'group') o.els = cleanEls(o.els, edit);
    return o;
  });
}
function reEsc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

// ---------------------------------------------------------------- план опросов
// Для каждого DB — непрерывные участки, покрывающие используемые поля (≤ maxWords слов, разрывы ≤ 32 байт объединяются).
function planPolls(project, used) {
  const maxW = Math.max(4, +(project.conn && project.conn.maxWords) || 90);
  const byDb = {};
  used.forEach(function (u) { (byDb[u.db.id] = byDb[u.db.id] || { db: u.db, l: [] }).l.push(u); });
  const polls = [], tagMap = {}, warn = [];
  Object.keys(byDb).forEach(function (id) {
    const db = byDb[id].db, l = byDb[id].l;
    l.sort(function (a, b) { return a.f.o - b.f.o; });
    if (db.raw) {          // адрес вставлен вручную: один участок от смещения 0
      const end = l.reduce(function (m, u) { return Math.max(m, u.f.o + TYPES[u.f.t][0]); }, 0);
      const n = Math.ceil(end / 2);
      if (n > maxW) warn.push('DB «' + db.name + '»: адрес вручную — нужно ' + n + ' слов за один запрос (больше ' + maxW + ')');
      const k = 'r_' + db.name.replace(/\W/g, '_');
      polls.push({ k: k, n: n, ms: +db.ms || 500, d: db.name, raw: db.raw, db: db });
      l.forEach(function (u) { tagMap[u.name] = { p: k, o: u.f.o }; });
      return;
    }
    let cur = null;
    l.forEach(function (u) {
      const o = +u.f.o, end = o + TYPES[u.f.t][0];
      if (cur && (end - cur.s) <= maxW * 2 && o - cur.e <= 32) { cur.e = Math.max(cur.e, end); cur.u.push(u); return; }
      cur = { s: o & ~1, e: end, u: [u] };
      polls.push(cur);
      cur.db = db;
    });
  });
  const out = polls.map(function (p) {
    if (p.k) return p;
    const n = Math.ceil((p.e - p.s) / 2), k = 'r' + p.db.num + '_' + p.s;
    p.u.forEach(function (u) { tagMap[u.name] = { p: k, o: u.f.o - p.s }; });
    return { k: k, n: n, ms: +p.db.ms || 500, d: 'DB' + p.db.num + '.' + p.s + '…' + (p.s + n * 2 - 1), db: p.db, s: p.s };
  });
  return { polls: out, tagMap: tagMap, warn: warn };
}

// ---------------------------------------------------------------- экспорт одного окна
function exportScreen(project, screenId, engine, opts) {
  opts = opts || {};
  const scr = (project.screens || []).find(function (s) { return s.id === screenId; });
  if (!scr) throw new Error('нет окна ' + screenId);
  const conn = project.conn || {};
  const dev = conn.dev || 'Siemens S7-1200/S7-1500';
  const warn = [], info = [];
  const els = cleanEls(scr.els, opts.edit);
  let pops = popupRefs(els, project);
  if (opts.allPops) { pops = {}; (project.pops || []).forEach(function (p) { pops[p.id] = p; }); }
  const popsOut = {};
  Object.keys(pops).forEach(function (id) {
    const p = pops[id];
    popsOut[id] = { ti: p.ti || '', w: +p.w || 400, h: +p.h || 300, els: cleanEls(p.els, opts.edit) };
    if (p.x !== undefined && p.x !== null && p.x !== '') popsOut[id].x = +p.x;
    if (p.y !== undefined && p.y !== null && p.y !== '') popsOut[id].y = +p.y;
    if (p.cl === false) popsOut[id].cl = false;
    if (p.bg) popsOut[id].bg = p.bg;
    if (+p.w > +scr.w || +p.h > +scr.h) warn.push('Окно «' + (p.name || id) + '» больше объекта ' + scr.w + '×' + scr.h);
  });
  const everything = els.concat(Object.keys(popsOut).reduce(function (a, k) { return a.concat(popsOut[k].els); }, []));
  const refs = refsOf(everything);
  const all = allTags(project);
  const usedNames = {};
  refs.forEach(function (r) {
    if (/^gcu(set|spd)?:/.test(r)) return;
    if (r.indexOf('#') >= 0) {
      const re = new RegExp('^' + reEsc(r).split('#').join('[^.]*?') + '$');
      let any = false;
      Object.keys(all).forEach(function (n) { if (re.test(n)) { usedNames[n] = 1; any = true; } });
      if (!any) warn.push('Шаблон тега «' + r + '» (с #) не совпал ни с одним тегом');
      return;
    }
    if (all[r]) usedNames[r] = 1;
    else warn.push('Тег «' + r + '» не найден в «Данные ПЛК»');
  });
  const used = Object.keys(usedNames).map(function (n) { return { name: n, db: all[n].db, f: all[n].f }; });
  const plan = planPolls(project, used);
  plan.warn.forEach(function (w) { warn.push(w); });
  const cfg = {}, tags = {}, amap = {};
  const gcu = usesGcu(everything, refs);
  if (gcu) Object.keys(GCU_ADDR).forEach(function (k) { cfg[k] = encodeAddress(dev, GCU_ADDR[k][0], GCU_ADDR[k][1]); });
  const polls = plan.polls.map(function (p) {
    cfg[p.k] = p.raw ? p.raw : encodeAddress(dev, p.db.num, p.s);
    amap[p.k] = { db: p.db.num, off: p.raw ? 0 : p.s };
    return { k: p.k, n: p.n, ms: p.ms, d: p.d };
  });
  used.forEach(function (u) {
    const f = u.f, m = plan.tagMap[u.name], t = { p: m.p, o: m.o, t: f.t };
    if (f.t === 'bool') t.b = +f.b || 0;
    if (f.sc && f.sc.length === 4 && f.sc.some(function (x) { return x !== '' && x !== null; })) t.sc = f.sc.map(Number);
    if (f.d !== undefined && f.d !== '' && +f.d) t.d = +f.d;
    if (f.ds) { t.ds = f.ds; if (f.da) t.da = +f.da; }
    if (f.wr) {
      if (u.db.raw) warn.push('Тег «' + u.name + '»: запись невозможна — адрес DB задан вручную');
      else {
        const size = TYPES[f.t][0], wo = size === 1 ? (f.o & ~1) : +f.o;
        if (size > 1 && (f.o & 1)) warn.push('Тег «' + u.name + '»: нечётное смещение ' + f.o + ' — слово должно начинаться с чётного байта');
        const k = 'w' + u.db.num + '_' + wo;
        cfg[k] = encodeAddress(dev, u.db.num, wo);
        amap[k] = { db: u.db.num, off: wo };
        t.w = k;
      }
    }
    tags[u.name] = t;
  });
  // запись в теги без признака «запись»
  walkObj(everything, function (k, v, o) {
    if ((k === 'a' && (v === 'write' || v === 'toggle' || v === 'keypad')) || (k === 't' && (v === 'input' || v === 'hold'))) {
      const nm = o.tag, nms = [nm, o.alive].filter(Boolean);
      nms.forEach(function (n) {
        if (/^gcu:/.test(n)) warn.push('Запись в «' + n + '»: данные ГЦУ только для чтения (для уставок — gcuset:)');
        else if (!/^gcu(set|spd):/.test(n) && all[n] && !all[n].f.wr) warn.push('Тег «' + n + '» используется для записи, но в «Данные ПЛК» не отмечен «Запись»');
        else if (!n) warn.push('Элемент ' + (o.id || '') + ': не выбран тег для записи');
      });
    }
  });
  if (+scr.h < 460) info.push('Высота объекта ' + scr.h + ' — экранная клавиатура (452 px) не поместится');
  if (scr.winAddr) cfg.winAddr = scr.winAddr;
  cfg.demo = !!scr.demo;
  cfg.fontFamily = conn.font || 'Arial';
  cfg.useBold = conn.bold !== false;
  cfg.boolHighByteFirst = conn.hiFirst !== false;
  cfg.realWordSwap = !!conn.realSwap;
  if (scr.pin) cfg.pin = String(scr.pin);
  const screen = { w: +scr.w, h: +scr.h, ox: +scr.ox || 0, oy: +scr.oy || 0, els: els, pops: popsOut, tags: tags, polls: polls };
  if (scr.bg) screen.bg = scr.bg;
  screen.opt = {};
  if (scr.diag) screen.opt.diag = [+scr.diag[0], +scr.diag[1]];
  if (scr.demoChip) screen.opt.demoChip = [+scr.demoChip[0], +scr.demoChip[1]];
  if (scr.noCommBar) screen.opt.noCommBar = true;
  let code = null, size = 0;
  if (engine) {
    const types = typesOf(everything);
    const names = Object.keys(engine.r).filter(function (t) { return types[t]; });
    const head = '// =====================================================================\n' +
      '//  ' + (project.name || 'Проект') + ' · ' + (scr.name || scr.id) + '\n' +
      '//  JS Object для Weintek cMT X (EasyBuilder Pro >= 6.09). Сделано в конструкторе панели ' + (engine.ver || '') + '\n' +
      '//  Объект: X' + (scr.ox || 0) + ' Y' + (scr.oy || 0) + ' ' + scr.w + '×' + scr.h + '. Вставлять целиком; конфигурация — «Шаблон…».\n' +

  p.nextId = mx + 1;
  return p;
}
function loadProject(p, msg) {
  proj = normalize(p);
  cur = { kind: 'screen', id: proj.screens[0].id }; lastScreen = cur.id; sel = [];
  undoS.length = 0; redoS.length = 0; RT.mem = {};
  memInitDemo(true);
  refreshAll(false); autosave();
  if (msg) toast(msg);
}
async function newProject() {
  if (!(await ask('Новый проект?', 'Текущий проект в браузере будет заменён. Сохраните его в файл, если он нужен.', 'Создать'))) return;
  loadProject({ name: 'Новый проект', dbs: [{ id: 'db1', name: 'MY_DB', num: 200, ms: 500, fields: autoOffsets([{ n: 'Level', t: 'real', cm: 'уровень, %', d: 50, ds: 'sin', da: 20 }, { n: 'Run', t: 'bool', cm: 'работает', d: 1 }, { n: 'Cmd', t: 'int', cm: 'команда', wr: true }]) }],
    screens: [{ id: 's1', name: 'Окно 1', w: 1024, h: 664, ox: 0, oy: 48, bg: CL.bg, demoChip: [860, 60], els: [] }], pops: [] }, 'Новый проект. Добавьте блоки данных в «Данные ПЛК» и перетащите элементы.');
}
function saveProject() {
  const txt = JSON.stringify(proj, null, 1);
  const name = (proj.name || 'проект').replace(/[^\wА-Яа-яЁё]+/g, '_') + '.constructor.json';
  download(name, txt);
}
function saveDialog() {
  const ta = h('textarea', { class: 'code', readonly: true, style: 'height:260px' }); ta.value = JSON.stringify(proj, null, 1);
  openModal('Сохранить проект', [
    h('p', { class: 'note' }, 'Проект сохраняется в этом браузере сам. Чтобы перенести на другой компьютер или положить в репозиторий (hmi/constructor/projects/), сохраните файл.'),
    fieldRow('Имя проекта', textIn(proj, 'name', { empty: false })),
    h('div', { class: 'btnrow' }, h('button', { class: 'accent', onclick: saveProject }, 'Скачать файл проекта'), h('button', { onclick: () => copyText(ta, 'Проект скопирован — вставьте в блокнот и сохраните как .json') }, 'Копировать текст проекта')),
    ta]);
}
function openFile(f) {
  const rd = new FileReader();
  rd.onload = () => { try { const p = JSON.parse(rd.result); if (!p.screens) throw new Error('это не файл проекта конструктора'); loadProject(p, 'Открыт проект: ' + (p.name || f.name)); } catch (e) { toast('Не открылся: ' + e.message); } };
  rd.readAsText(f, 'utf-8');
}

// ---------------------------------------------------------------- окна-диалоги, сообщения
function openModal(title, content, narrow) {
  $('#mTitle').textContent = title;
  const b = $('#mBody'); b.innerHTML = '';
  (Array.isArray(content) ? content : [content]).forEach(c => c && b.append(c));
  $('#modal .mbox').classList.toggle('narrow', !!narrow);
  $('#modal').hidden = false;
}
function closeModal() { $('#modal').hidden = true; $('#mBody').innerHTML = ''; refreshDatalist(); if (mode === 'edit') renderInsp(); else renderSim(); }
function ask(title, text, ok) {
  return new Promise(res => {
    const yes = h('button', { class: 'accent', onclick: () => { $('#modal').hidden = true; res(true); } }, ok || 'Да');
    const no = h('button', { onclick: () => { $('#modal').hidden = true; res(false); } }, 'Отмена');
    openModal(title, [h('p', {}, text), h('div', { class: 'btnrow', style: 'justify-content:flex-end' }, no, yes)], true);
    setTimeout(() => yes.focus(), 20);
  });
}
let toastT = 0;
function toast(s) { const t = $('#toast'); t.textContent = s; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2800); }
function status(s) { $('#stMsg').textContent = s || ''; }
function checkStatus() {
  try { const r = exportScreen(proj, curScreen().id, null); status(r.warn.length ? '⚠ ' + r.warn[0] + (r.warn.length > 1 ? ' (+' + (r.warn.length - 1) + ')' : '') : ''); } catch (e) { status(e.message); }
}
function updButtons() {
  $('#bUndo').disabled = !undoS.length; $('#bRedo').disabled = !redoS.length;
  const n = sel.length, ed = mode === 'edit';
  ['#bCopy', '#bDup', '#bDel', '#bFront', '#bBack'].forEach(s => { $(s).disabled = !n || !ed; });
  $('#bGroup').disabled = n < 2 || !ed; $('#bUngroup').disabled = !selEls().some(e => e.t === 'group') || !ed;
  $('#bPaste').disabled = !ed;
}
function help() {
  openModal('Как пользоваться конструктором', [h('div', { style: 'columns:2 340px;column-gap:28px;font-size:13px' },
    h('h3', {}, 'Идея'), h('p', {}, 'Каждое окно конструктора — это один JS-объект EasyBuilder во всю рабочую область, как ваши окна 10–18. Конструктор сам пишет код: вы двигаете элементы мышкой и выбираете теги из списка.'),
    h('p', {}, 'Холст — это настоящий код панели, запущенный в браузере. Что видите здесь — то будет на панели (шрифт панели может немного отличаться).'),
    h('h3', {}, 'Порядок работы'),
    h('ol', { class: 'steps' }, h('li', {}, h('b', {}, 'Данные ПЛК'), ': добавьте DB. Проще всего — «Импорт…» исходника DB из TIA: смещения посчитаются сами. Отметьте «Запись» у полей, в которые панель пишет.'),
      h('li', {}, 'Перетащите элементы из палитры, справа выберите тег (поле с ⋯ — список всех тегов с комментариями).'),
      h('li', {}, h('b', {}, '▶ Просмотр'), ': нажимайте кнопки, меняйте значения тегов справа — проверка без ПЛК.'),
      h('li', {}, h('b', {}, 'Экспорт в панель'), ': скопируйте код и конфигурацию в JS-объект.')),
    h('h3', {}, 'Опросы ПЛК'), h('p', {}, 'Отдельно настраивать не нужно: конструктор сам собирает использованные теги каждого DB в непрерывные участки (не больше «Слов за запрос») и опрашивает их с периодом DB. Список — внизу окна «Данные ПЛК».'),
    h('p', {}, 'Запись бита: панель читает слово, меняет один бит и записывает слово обратно. Для команд надёжнее Int-код, который ПЛК обнуляет (как в DB100).'),
    h('h3', {}, 'Данные ГЦУ'), h('p', {}, 'Теги gcu:… — это DB100/DB101, которые уже разбирает ядро панели. Задвижки и насосы с данными «ГЦУ» по нажатию открывают готовые окна задвижки/насоса. gcuset:… — уставки DB101 (запись с проверкой диапазона ПЛК).'),
    h('h3', {}, 'Свои окна и #'), h('p', {}, 'Окна → «+ Своё окно». В тегах окна пишите # вместо номера: MY_DB.Motor[#].Run. Кнопка «Открыть своё окно» с номером 2 покажет мотор 2.'),
    h('h3', {}, 'Мышь и клавиши'),
    h('p', {}, h('span', { class: 'kbd' }, 'Shift'), ' + щелчок — добавить к выделению; рамка по пустому месту — выделить несколько. ', h('span', { class: 'kbd' }, 'Alt'), ' при перетаскивании — без привязки. ', h('span', { class: 'kbd' }, 'Shift'), ' — только по горизонтали/вертикали, при изменении размера — с сохранением пропорций.'),
    h('p', {}, h('span', { class: 'kbd' }, '←↑→↓'), ' — сдвиг на 1, с ', h('span', { class: 'kbd' }, 'Shift'), ' — на шаг сетки. ', h('span', { class: 'kbd' }, 'Ctrl+Z / Y'), ' отмена/повтор, ', h('span', { class: 'kbd' }, 'Ctrl+C / V / D'), ', ', h('span', { class: 'kbd' }, 'Del'), ', ', h('span', { class: 'kbd' }, 'Ctrl+G'), ' группа, ', h('span', { class: 'kbd' }, 'Ctrl+колесо'), ' масштаб.'),
    h('h3', {}, 'Где хранится проект'), h('p', {}, 'Автоматически — в этом браузере. Для переноса и истории — «Сохранить» (файл .json) и положите его в hmi/constructor/projects/ репозитория.'))]);
}

// ---------------------------------------------------------------- клавиатура
function initKeys() {
  window.addEventListener('keydown', ev => {
    if (!$('#modal').hidden) { if (ev.key === 'Escape') { closeModal(); } return; }
    const t = ev.target, typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT');
    const ctrl = ev.ctrlKey || ev.metaKey, k = ev.key.toLowerCase();
    if (ctrl && k === 's') { ev.preventDefault(); saveDialog(); return; }
    if (typing) return;
    if (mode !== 'edit') return;
    if (ctrl && (k === 'z' || k === 'я')) { ev.preventDefault(); if (ev.shiftKey) redo(); else undo(); return; }
    if (ctrl && (k === 'y' || k === 'н')) { ev.preventDefault(); redo(); return; }
    if (ctrl && (k === 'c' || k === 'с')) { ev.preventDefault(); copySel(); return; }
    if (ctrl && (k === 'x' || k === 'ч')) { ev.preventDefault(); copySel(); delSel(); return; }
    if (ctrl && (k === 'v' || k === 'м')) { ev.preventDefault(); paste(); return; }
    if (ctrl && (k === 'd' || k === 'в')) { ev.preventDefault(); dupSel(); return; }
    if (ctrl && (k === 'a' || k === 'ф')) { ev.preventDefault(); sel = curEls().filter(e => !e._l && !e._h).map(e => e.id); refreshSel(); return; }
    if (ctrl && (k === 'g' || k === 'п')) { ev.preventDefault(); if (ev.shiftKey) ungroupSel(); else groupSel(); return; }
    if (ev.key === 'Delete' || ev.key === 'Backspace') { ev.preventDefault(); delSel(); return; }
    if (ev.key === 'Escape') { sel = []; refreshSel(); return; }
    const st = ev.shiftKey ? grid.size : 1;
    if (ev.key === 'ArrowLeft') { ev.preventDefault(); nudge(-st, 0); } if (ev.key === 'ArrowRight') { ev.preventDefault(); nudge(st, 0); }
    if (ev.key === 'ArrowUp') { ev.preventDefault(); nudge(0, -st); } if (ev.key === 'ArrowDown') { ev.preventDefault(); nudge(0, st); }
  });
}

// ---------------------------------------------------------------- запуск
function init() {
  $('#bNew').onclick = newProject; $('#bOpen').onclick = () => $('#fOpen').click(); $('#fOpen').onchange = ev => { const f = ev.target.files[0]; if (f) openFile(f); ev.target.value = ''; };
  $('#bSave').onclick = saveDialog;
  $('#bExample').onclick = async () => { if (await ask('Загрузить пример?', 'Мнемосхема ГЦУ (перенос окна 10/16) и образец со своим DB. Текущий проект в браузере будет заменён.', 'Загрузить')) loadProject(JSON.parse(JSON.stringify(EXAMPLES.gcu)), 'Загружен пример: мнемосхема ГЦУ'); };
  $('#bUndo').onclick = undo; $('#bRedo').onclick = redo; $('#bCopy').onclick = copySel; $('#bPaste').onclick = paste; $('#bDup').onclick = dupSel; $('#bDel').onclick = delSel;
  $('#bGroup').onclick = groupSel; $('#bUngroup').onclick = ungroupSel; $('#bFront').onclick = () => order('front'); $('#bBack').onclick = () => order('back');
  $('#cGrid').onchange = ev => { grid.on = ev.target.checked; drawOv(); };
  $('#sGrid').onchange = ev => { grid.size = +ev.target.value; drawOv(); };
  $('#cSnap').onchange = ev => { grid.snap = ev.target.checked; };
  $('#sZoom').onchange = ev => { if (ev.target.value === 'fit') { zoomMode = 'fit'; layoutStage(); } else setZoom(+ev.target.value); };
  $('#mEdit').onclick = () => setMode('edit'); $('#mRun').onclick = () => setMode('run');
  $('#bData').onclick = openData; $('#bExport').onclick = openExport; $('#bHelp').onclick = help;
  $('#mClose').onclick = closeModal;
  $('#modal').addEventListener('mousedown', ev => { if (ev.target.id === 'modal') closeModal(); });
  $$('.tabs button').forEach(b => b.onclick = () => { leftTab = b.dataset.tab; $$('.tabs button').forEach(x => x.classList.toggle('on', x === b)); $$('.tabpane').forEach(p => { p.hidden = p.id !== 'tab-' + leftTab; }); renderLayers(); });
  $$('#alignbar button').forEach(b => b.onclick = () => align(b.dataset.al));
  document.addEventListener('mousedown', ev => { if (!ev.target.closest('#ctx')) hideCtx(); });
  initStage(); initKeys();
  let p = null;
  try { const s = localStorage.getItem(LS_KEY); if (s) p = JSON.parse(s); } catch (e) { }
  loadProject(p || JSON.parse(JSON.stringify(EXAMPLES.gcu)), p ? 'Восстановлен проект из браузера' : 'Открыт пример: мнемосхема ГЦУ. «Новый» — начать с чистого листа.');
}
init();
